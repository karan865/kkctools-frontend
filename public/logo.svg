<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Hexagonal Background Shield -->
    <rect width="80" height="80" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stylized Geometric 'K' Mark -->
    <!-- Left vertical spine (Precision Caliper Style) -->
    <path d="M26 22 H34 V58 H26 Z" fill="url(#blueGrad)" rx="3" />
    
    <!-- Top-Right Angled Arm with Orange Energy Accent -->
    <path d="M34 40 L48 24 C50 22 54 22 56 24 L58 26 C60 28 60 31 58 33 L45 47 Z" fill="url(#orangeGrad)" />
    
    <!-- Bottom-Right Angled Leg with Blue Tech Shading -->
    <path d="M37 45 L50 60 C52 62 55 62 57 60 L59 58 C61 56 61 53 59 51 L47 38 Z" fill="url(#blueGrad)" />

    <!-- Center Precision Energy Dot / Node -->
    <circle cx="36" cy="44" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: KKC TOOLS -->
  <g transform="translate(110, 24)">
    <!-- KKC in bold tech typography -->
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="38" letter-spacing="1" fill="#FFFFFF">
      KKC
      <tspan fill="url(#orangeGrad)">TOOLS</tspan>
    </text>

    <!-- Tagline: Sub-wordmark -->
    <text x="2" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="3.2" fill="#94A3B8">
      PRECISION CALCULATORS &amp; WEB UTILITIES
    </text>
  </g>
</svg>
